spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Habilita o console do H2 no navegador (localhost:8080/h2-console)
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ativar a validacao globalmente
spring.mvc.hiddenmethod.filter.enabled=true

# Configurar a localizacao do arquivo de mensagens de validacao
spring.messages.basename=messages

# Ativar a validacao JSR-303/JSR-349/JSR-380
spring.web.locale=pt_BR

# Configurar a localizacao do arquivo de mensagens de validacao especificas do Hibernate Validator
spring.messages.encoding=UTF-8

springdoc.api-docs.path=/api/swagger.json
springdoc.swagger-ui.path=/swagger-ui/index.html

spring.thymeleaf.check-template-location=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

